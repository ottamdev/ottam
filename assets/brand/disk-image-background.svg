<svg width="660" height="400" viewBox="0 0 660 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- The release disk image's window background, rendered by
       scripts/layout-disk-image.sh. Finder draws Ottam.app centered at
       (170, 180) and the Applications link at (490, 180), with 128-point
       icons; the arrow runs from one to the other. The window's 400-point
       frame includes its title bar, so keep art out of the bottom 40. -->
  <defs>
    <linearGradient id="thread" gradientUnits="userSpaceOnUse" x1="252" y1="0" x2="408" y2="0">
      <stop offset="0" stop-color="#FF9500"/>
      <stop offset="1" stop-color="#FF4D0F"/>
    </linearGradient>
  </defs>
  <rect width="660" height="400" fill="#FBF8F5"/>
  <path d="M 252 180 L 404 180 M 390 166 L 406 180 L 390 194"
        stroke="url(#thread)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="330" y="326" text-anchor="middle" font-family="Helvetica Neue" font-size="15" fill="#6E6E73">Drag Ottam to Applications</text>
</svg>
