[package]
name = "ottam-test-mcp"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["form", "http1", "query", "tokio"] }
base64 = "0.22"
rmcp = { version = "=3.7.0", default-features = false, features = [
    "elicitation",
    "server",
    "transport-io",
    "transport-streamable-http-server",
] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "net", "process", "time"] }
